version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DATABASE_URL=file:./dev.db
      - PRISMA_USER_CONSENT_FOR_DANGEROUS_AI_ACTION=yes
    volumes:
      - ./backend/prisma/dev.db:/app/prisma/dev.db

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      - backend
